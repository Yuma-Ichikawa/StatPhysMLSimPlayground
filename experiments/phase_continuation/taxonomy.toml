schema_version = "3.0"
coordinates = ["data", "architecture", "objective", "dynamics", "scale", "lifecycle"]
outcomes = ["preserved", "renormalized", "rounded", "split", "merged", "new_regime", "hysteretic", "path_dependent", "statistical_computational_separation", "semantic_failure", "censored_no_crossing", "unresolved", "not_comparable"]

[theory_status]
T0 = "exact finite"
T1 = "asymptotically exact"
T2 = "state evolution, DMFT, or mean-field closure"
T3 = "controlled approximation"
T4 = "calibrated surrogate"
T5 = "phenomenological"
T6 = "empirical only"

[realism_level]
R0 = "solvable stylized model"
R1 = "reduced stochastic model"
R2 = "trainable synthetic system with latent truth"
R3 = "structured or semi-natural carrier"
R4 = "natural data or realistic environment"
R5 = "pretrained, open-weight, or lifecycle endpoint"

[evidence_status]
E0 = "unit or sanity validation"
E1 = "exploratory screen"
E2 = "replicated frozen comparison"
E3 = "finite-size transition evidence"
E4 = "prospective transport"
E5 = "matched intervention"
E6 = "external endpoint"

[tier_definitions]
A = "High evidence-vector summary; does not replace T/R/E coordinates."
B = "Replicated mechanism or finite-size response comparison."
"B+" = "End-to-end trainable synthetic bridge with latent truth."
C = "Natural, environment, checkpoint, or lifecycle endpoint."

[program_tiers]
transformer_anchor = "A"
transformer_architecture = "B"
diffusion_anchor = "A"
reinforcement_anchor = "A"
multiagent_anchor = "A"
matched_latent = "B"
learned_neural_bridges = "B+"
naturalistic_endpoints = "C"

[[endpoints]]
id = "T-LEARNED-DECODER"
domain = "transformer"
family = "learned_decoder"
tier = "B+"
theory_status = "T6"
realism_level = "R2"
evidence_status = "E2"
state_object = "representation_state"
phenomenon_type = "crossover"
finite_size_coordinate = "width"
scaling_path = "context and depth fixed; data proportional to width"
status = "runnable"
observables = ["token_accuracy", "context_ablation_delta", "perplexity", "oracle_gap"]
falsifier = "Causal attention and decoder depth do not improve continuation over the local baseline at matched width."

